<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e73be;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d7c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- University emblem circle -->
  <circle cx="30" cy="30" r="26" fill="none" stroke="url(#grad1)" stroke-width="2.5"/>
  <circle cx="30" cy="30" r="20" fill="none" stroke="url(#grad1)" stroke-width="1.5"/>
  <!-- Star (center symbol) -->
  <polygon points="30,16 33.5,24 42,24 35,29 37.5,37 30,32 22.5,37 25,29 18,24 26.5,24" fill="url(#grad1)"/>
  <!-- Text: Université -->
  <text x="65" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e73be" direction="ltr">Université</text>
  <!-- Text: Abdelhamid Ibn Badis -->
  <text x="65" y="36" font-family="Arial, sans-serif" font-size="9" fill="#003d7c" direction="ltr">Abdelhamid Ibn Badis</text>
  <!-- Text: Mostaganem -->
  <text x="65" y="48" font-family="Arial, sans-serif" font-size="8" fill="#1e73be" direction="ltr">Mostaganem</text>
</svg>
